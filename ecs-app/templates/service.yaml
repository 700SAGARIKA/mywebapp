apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecs-app.fullname" . }}
  labels:
    {{- include "ecs-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
  selector:
    {{- include "ecs-app.selectorLabels" . | nindent 4 }}
